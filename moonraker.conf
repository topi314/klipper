primary_branch: main
managed_services: klipper
# <<< MEDUSAHC CALIBRATE UPDATE MANAGER <<<

[update_manager eddy_seek]
type: git_repo
path: ~/EddySeek
origin: https://github.com/charliemayall/EddySeek.git
primary_branch: main
channel: stable
managed_services: klipper
is_system_service: False
install_script: install.sh