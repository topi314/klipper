# MedusaHC dock teach — measure only (console output)
#
#   1. M84 (keep the head clear of the bed by hand if needed)
#   2. Hand-move to dock
#   3. TEACH_DOCK TOOL=0
#
# Reads tools_direction from _TOOL_CFG:
#   -1 rear docks: home Y toward the front
#    1 front docks: home Y toward the back
# Then homes X and prints measured X/Y.

[medusahc_dock_teach]
home_current_ratio: 0.7
verbose: True

[gcode_macro TEACH_DOCK]
description: Hand-place at dock, home Y then X, print measured dock X/Y
gcode:
    MHC_TEACH_DOCK TOOL={params.TOOL|default(params.T)|int}
