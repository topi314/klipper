[duplicate_pin_override]
pins: ebb:PB14, ebb:PA8, ebb:PB6

[tmc2209 extruder]
uart_pin: ebb:PB3
run_current: 0.900
hold_current: 0.300
interpolate: true

[extruder]
step_pin: ebb:PB14
dir_pin: !ebb:PA8
enable_pin: !ebb:PB6
microsteps: 32
rotation_distance: 4.5469
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: expander:PA0
sensor_pin: expander:PA6
sensor_type: ATC Semitec 104NT-4-R025H42G
control: pid
pid_Kp: 34.045
pid_Ki: 10.810
pid_Kd: 26.804
min_temp: 0
max_temp: 290
max_extrude_cross_section: 9999999
max_extrude_only_distance: 700
min_extrude_temp: 0

[heater_fan hotend_fan]
heater: extruder
pin: expander:PA1

[verify_heater extruder]
check_gain_time: 20
hysteresis: 10
heating_gain: 1

