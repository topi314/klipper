run_current: 0.900
hold_current: 0.300
interpolate: true

[extruder]
step_pin: ebb:PB14
dir_pin: !ebb:PA8
enable_pin: !ebb:PB6
microsteps: 32
rotation_distance: 4.6865
pressure_advance: 0.035
pressure_advance_smooth_time: 0.019
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: expander:PA0
sensor_pin: expander:PA6
sensor_type: ATC Semitec 104GT-2
control: pid
pid_Kp: 30.597
pid_Ki: 8.868
pid_Kd: 26.393
min_temp: 0
max_temp: 290
max_extrude_cross_section: 9999999
max_extrude_only_distance: 700
min_extrude_temp: 0
smooth_time: 2.0

[heater_fan hotend_fan]
heater: extruder
pin: expander:PA1

[verify_heater extruder]
check_gain_time: 20
hysteresis: 10
heating_gain: 1

