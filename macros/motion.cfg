[gcode_macro E_OFF]
description: Disable extruder motor
gcode:
	SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0

[gcode_macro XY_OFF]
description: Disable XY motors and clear XY homing
gcode:
	SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
	SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0
	SET_KINEMATIC_POSITION CLEAR_HOMED=XY

[gcode_macro _HOME_REQUEST]
description: Conditional home for MedusaHC toolchange paths
gcode:
	_CG28

[gcode_macro PARK]
description: Park rear-right at y_safe (clear of docks)
gcode:
	{% if "xyz" not in printer.toolhead.homed_axes %}
		{ action_respond_info("PARK: printer not homed") }
	{% else %}
		SAVE_GCODE_STATE NAME=PARK
		{% set z_pos = [printer.toolhead.position.z, 20] | max %}
		{% set y_safe = printer["gcode_macro _TOOL_CFG"].y_safe %}
		{% set x_park = printer.toolhead.axis_maximum.x - 10 %}
		G90
		G0 Z{z_pos} F600
		G0 X{x_park} Y{y_safe} F6000
		RESTORE_GCODE_STATE NAME=PARK
	{% endif %}

[gcode_macro PARK_FRONT]
description: Park front center
gcode:
	_CG28
	SAVE_GCODE_STATE NAME=PARKFRONT
	{% set bed = printer["gcode_macro _BED"] %}
	{% set x_mid = bed.origin_x + bed.size_x / 2 %}
	{% set z_pos = printer.toolhead.axis_maximum.z / 2 %}
	G90 ; absolute positioning
	G0 Z{z_pos} F600
	G0 X{x_mid} Y{printer.toolhead.axis_minimum.y + 5} F6000
	RESTORE_GCODE_STATE NAME=PARKFRONT

[gcode_macro PARK_FRONT_LOW]
description: Park front center, but low down.
gcode:
	_CG28
	SAVE_GCODE_STATE NAME=PARKFRONT
	{% set bed = printer["gcode_macro _BED"] %}
	{% set x_mid = bed.origin_x + bed.size_x / 2 %}
	{% set z_target = 20 %}
	{% set z_travel = [printer.toolhead.position.z, z_target] | max %}
	G90 ; absolute positioning
	G0 Z{z_travel} F600
	G0 X{x_mid} Y{printer.toolhead.axis_minimum.y + 5} F6000
	G0 Z{z_target} F600
	RESTORE_GCODE_STATE NAME=PARKFRONT

[gcode_macro PARK_BED]
description: Park 15mm above center of bed
gcode:
	_CG28
	SAVE_GCODE_STATE NAME=PARKBED
	{% set bed = printer["gcode_macro _BED"] %}
	{% set x_mid = bed.origin_x + bed.size_x / 2 %}
	{% set y_mid = bed.origin_y + bed.size_y / 2 %}
	{% set z_target = 15 %}
	{% set z_travel = [printer.toolhead.position.z, z_target] | max %}
	G90 ; absolute positioning
	G0 Z{z_travel} F600
	G0 X{x_mid} Y{y_mid} F6000
	G0 Z{z_target} F600
	RESTORE_GCODE_STATE NAME=PARKBED

[gcode_macro PROBE_CENTER]
description: Move probe to center of bed
gcode:
	SAVE_GCODE_STATE NAME=PROBE_CENTER
	{% set bed = printer["gcode_macro _BED"] %}
	{% set eddy = printer.configfile.settings['probe_eddy_current btt_eddy'] %}
	{% set x_mid = bed.origin_x + bed.size_x / 2 %}
	{% set y_mid = bed.origin_y + bed.size_y / 2 %}
	{% set x_pos = x_mid - eddy.x_offset|float %}
	{% set y_pos = y_mid - eddy.y_offset|float %}
	{% set z_hop = [printer.toolhead.position.z, 10]|max %}
	G90
	G0 Z{z_hop} F600
	G1 X{x_pos} Y{y_pos} F6000
	RESTORE_GCODE_STATE NAME=PROBE_CENTER

[gcode_macro CENTER]
description: Move toolhead to center of bed
gcode:
	_CG28
	SAVE_GCODE_STATE NAME=CENTER
	{% set bed = printer["gcode_macro _BED"] %}
	{% set x_mid = bed.origin_x + bed.size_x / 2 %}
	{% set y_mid = bed.origin_y + bed.size_y / 2 %}
	{% set z_hop = [printer.toolhead.position.z, 10]|max %}
	G90
	G0 Z{z_hop} F600
	G1 X{x_mid} Y{y_mid} F6000
	RESTORE_GCODE_STATE NAME=CENTER

[gcode_macro FRONT]
description: Move toolhead to front
gcode:
	_CG28
	SAVE_GCODE_STATE NAME=FRONT
	{% set bed = printer["gcode_macro _BED"] %}
	{% set x_mid = bed.origin_x + bed.size_x / 2 %}
	{% set z_hop = [printer.toolhead.position.z, 10]|max %}
	G90
	G0 Z{z_hop} F600
	G0 X{x_mid} Y0 F6000
	RESTORE_GCODE_STATE NAME=FRONT
