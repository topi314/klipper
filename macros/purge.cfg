[gcode_macro PURGE_USED_TOOLS]
description: Line purge for every heated tool, parking each tool when its line is done
gcode:
	; Each tool heats under HEATING_NOZZLE, then the line itself is PURGING.
	; PRINT_START sets HEATING_NOZZLE again for the first printing tool after this returns.
	{% set N = printer.medusahc.tool_count|int %}
	{% set ns = namespace(temps=[], print_temps=[], purge_i=0) %}

	{% for i in range(N) %}
		{% set prefix = "EXTRUDER" if i == 0 else "EXTRUDER" ~ i %}
		{% set ns.temps = ns.temps + [params[prefix ~ "_TEMP"]|default(0)|float] %}
		{% set ns.print_temps = ns.print_temps + [params[prefix ~ "_PRINT_TEMP"]|default(0)|float] %}
	{% endfor %}

	{% for i in range(N) %}
		{% set ns.idle_temp = ns.temps[i] %}
		{% set ns.print_temp = ns.print_temps[i] %}
		{% if ns.print_temp > 0 %}
			{% set heater = "extruder" if i == 0 else "extruder" ~ i %}
			HELIX_PHASE_HEATING_NOZZLE
			SET_HEATER_TEMPERATURE HEATER={heater} TARGET={ns.print_temp}
			TEMPERATURE_WAIT SENSOR={heater} MINIMUM={ns.print_temp}
			T{i}
			HELIX_PHASE_PURGING
			LINE_PURGE INDEX={ns.purge_i}
			{% set ns.purge_i = ns.purge_i + 1 %}
			SET_HEATER_TEMPERATURE HEATER={heater} TARGET={ns.idle_temp}
			DROP_TOOL
		{% endif %}
	{% endfor %}

[gcode_macro LINE_PURGE]
description: Purge line at the front-left of the bed, shifted right per tool
variable_purge_height: 1.6
variable_tip_distance: 10
variable_purge_margin: 10
variable_purge_amount: 30
variable_flow_rate: 12
variable_verbose_enable: False
gcode:
	_LED STATE=purging
	{% set travel_speed = 300 * 60 | float %}
	{% set cross_section = printer.configfile.settings.extruder.max_extrude_cross_section | float %}

	{% if printer.firmware_retraction is defined %}
		{% set RETRACT = "G10" %}
		{% set UNRETRACT = "G11" %}
	{% else %}
		{% set RETRACT = 'G1 E-.5 F2100' | string %}
		{% set UNRETRACT = 'G1 E.5 F2100' | string %}
	{% endif %}

	{% set settings = printer["gcode_macro LINE_PURGE"] %}
	{% set verbose_enable = settings.verbose_enable | abs %}
	{% set purge_height = settings.purge_height | float %}
	{% set tip_distance = settings.tip_distance | float %}
	{% set purge_margin = settings.purge_margin | float %}
	{% set purge_amount = settings.purge_amount | float %}
	{% set flow_rate = settings.flow_rate | float %}
	{% set purge_index = params.INDEX | default(0) | int %}
	{% set wipe = 10.0 %}

	{% set bed = printer["gcode_macro _BED"] %}
	{% set bed_x0 = bed.origin_x | float %}
	{% set bed_y0 = bed.origin_y | float %}
	{% set bed_x1 = bed_x0 + (bed.size_x | float) %}

	# Front-left, then one line-width to the right for each extra tool
	{% set span = purge_amount + wipe %}
	{% set purge_x = bed_x0 + purge_margin + (purge_index * span) %}
	{% set purge_y = bed_y0 + purge_margin %}
	{% set purge_fits = purge_x >= bed_x0 and (purge_x + span) <= bed_x1 %}

	{% set purge_move_speed = (flow_rate / 5.0) * 60 | float %}

	{% if cross_section < 5 %}

		{action_respond_info("[Extruder] max_extrude_cross_section is insufficient for purge, please set it to 5 or greater. Purge skipped.")}

	{% else %}

		{% if verbose_enable == True %}

		{action_respond_info("Moving filament tip {}mms".format(
			(tip_distance),
		)) }
		{% endif %}

		{% if printer.firmware_retraction is defined %}
			{action_respond_info("KAMP purge is using firmware retraction.")}
		{% else %}
			{action_respond_info("KAMP purge is not using firmware retraction, it is recommended to configure it.")}
		{% endif %}

		{% if not purge_fits %}
			{action_respond_info("KAMP purge skipped: tool offset {} does not fit on the bed.".format(purge_index))}
		{% else %}
			{action_respond_info("KAMP purge starting at {}, {} and purging {}mm of filament, requested flow rate is {}mm3/s.".format(
				(purge_x),
				(purge_y),
				(purge_amount),
				(flow_rate),
			)) }

			SAVE_GCODE_STATE NAME=Prepurge_State

			G92 E0
			G0 F{travel_speed}
			G90
			G0 X{purge_x} Y{purge_y}
			G0 Z{purge_height}
			M83
			G1 X{purge_x + purge_amount} E{tip_distance + purge_amount} F{purge_move_speed}
			{RETRACT}
			G0 Z{purge_height + 2} F{travel_speed}
			G0 X{purge_x + purge_amount + wipe} F{travel_speed}

			RESTORE_GCODE_STATE NAME=Prepurge_State
		{% endif %}

	{% endif %}
	_LED_RESTORE
