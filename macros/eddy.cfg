[gcode_macro TAP_BASE_TOOL]
description: Tap with T0 to set true Z=0 via SET_KINEMATIC_POSITION
gcode:
	{% set keep_heat = params.KEEP_HEAT|default(0)|int %}
	M109 T0 S150
	T0
	G91
	G1 E-1 F3600
	G90
	CLEAN
	CLEAN
	{% set bed = printer["gcode_macro _BED"] %}
	{% set x_mid = bed.origin_x + bed.size_x / 2 %}
	{% set y_mid = bed.origin_y + bed.size_y / 2 %}
	G90
	G1 Z5 F600
	G1 X{x_mid} Y{y_mid} F6000
	PROBE METHOD=tap
	M400
	_APPLY_TAP_KINEMATIC
	{% if not keep_heat %}
		M104 T0 S0
	{% endif %}
	DROP_TOOL

[gcode_macro _APPLY_TAP_KINEMATIC]
gcode:
	{% set z = printer.toolhead.position.z %}
	{% set z_probe = printer.probe.last_probe_position.z %}
	{% set eddy_z = printer["gcode_macro _GLOBAL_STATE"].eddy_z|float %}
	{% set new_z = z - z_probe - eddy_z %}
	M118 TAP_BASE_TOOL: z={z} probe_z={z_probe} eddy_z={eddy_z} -> kinematic Z={new_z}
	SET_KINEMATIC_POSITION Z={new_z}

[gcode_macro Z_TILT_ADJUST]
rename_existing: _Z_TILT_ADJUST
gcode:
	SAVE_GCODE_STATE NAME=STATE_Z_TILT
	BED_MESH_CLEAR
	{% if not printer.z_tilt.applied %}
		_Z_TILT_ADJUST horizontal_move_z=8 retry_tolerance=1
	{% endif %}
	_Z_TILT_ADJUST horizontal_move_z=2
	RESTORE_GCODE_STATE NAME=STATE_Z_TILT

[gcode_macro BED_CALIBRATION]
gcode:
	BED_MESH_CALIBRATE METHOD=rapid_scan ADAPTIVE=1
