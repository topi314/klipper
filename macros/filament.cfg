[gcode_macro PURGE_FILAMENT]
description: Purge filament. Optional: T=<tool> TEMP=<c> LENGTH=<mm>
gcode:
	SAVE_GCODE_STATE NAME=PURGE_FILAMENT
	LOAD_UNLOAD_BEGIN {rawparams}

	{% set purge_length = params.LENGTH | default(50) | float %}

	M83 ; relative extrusion
	G1 E10 F{10 * 60} ; unretract
	G1 E{purge_length} F{5 * 60} ; purge filament
	G1 E-2 F{35 * 60} ; retract
	G1 E-8 F{10 * 60}

	M400
	RESTORE_GCODE_STATE NAME=PURGE_FILAMENT
	E_OFF

[gcode_macro LOAD_FILAMENT]
description: Load filament. Optional: T=<tool> TEMP=<c>
gcode:
	SAVE_GCODE_STATE NAME=LOAD_FILAMENT
	LOAD_UNLOAD_BEGIN {rawparams}

	M83 ; relative extrusion
	G1 E5 F60 ; extrude very slowly to allow the operator to feed the filament into the extruder gears
	G1 E50 F{10 * 60} ; move tip forward
	G1 E25 F{5 * 60} ; move tip rest of way, extrude a bit extra
	G1 E-2 F{35 * 60} ; retract
	G1 E-8 F{10 * 60}

	M400
	RESTORE_GCODE_STATE NAME=LOAD_FILAMENT
	E_OFF

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament. Optional: T=<tool> TEMP=<c>
gcode:
	SAVE_GCODE_STATE NAME=UNLOAD_FILAMENT
	LOAD_UNLOAD_BEGIN {rawparams}

	M83 ; relative extrusion
	G1 E-25 F{10 * 60} ; slowly remove tip from nozzle
	G1 E-50 F{35 * 60} ; spit out filament
	G1 E-50
	G1 E-50

	M400
	RESTORE_GCODE_STATE NAME=UNLOAD_FILAMENT
	E_OFF

[gcode_macro LOAD_ALL_FILAMENT]
description: Load filament into every tool. Optional: TEMP=<c>
gcode:
	{% set n = printer.medusahc.tool_count|int %}
	{% set temp = params.TEMP|default(230)|float %}
	{% for t in range(n) %}
		LOAD_FILAMENT T={t} TEMP={temp}
	{% endfor %}
	DROP_TOOL

[gcode_macro UNLOAD_ALL_FILAMENT]
description: Unload filament from every tool. Optional: TEMP=<c>
gcode:
	{% set n = printer.medusahc.tool_count|int %}
	{% set temp = params.TEMP|default(230)|float %}
	{% for t in range(n) %}
		UNLOAD_FILAMENT T={t} TEMP={temp}
	{% endfor %}
	DROP_TOOL

[gcode_macro LOAD_UNLOAD_BEGIN]
gcode:
	{% set current = printer.medusahc.current_tool|int %}
	{% if 'T' in params %}
		{% set t = params.T|int %}
	{% elif current >= 0 %}
		{% set t = current %}
	{% else %}
		{ action_raise_error("No tool mounted; specify T=<tool> (e.g. UNLOAD_FILAMENT T=0)") }
	{% endif %}

	{% if t < 0 or t >= printer.medusahc.tool_count|int %}
		{ action_raise_error("Invalid tool T=%s" % t) }
	{% endif %}

	{% if current != t %}
		T{t}
	{% endif %}

	{% set heater = 'extruder' if t == 0 else 'extruder' ~ t %}
	{% set extruder_temp = params.TEMP | default(printer[heater].target) | float %}

	{% if extruder_temp == 0 %}
		{% set extruder_temp = 230 %}
	{% endif %}

	{% set min_temp = printer.configfile.settings[heater].min_extrude_temp|float %}
	{% if extruder_temp < min_temp %}
		{ action_raise_error("extruder temp too low") }
	{% endif %}

	SET_HEATER_TEMPERATURE HEATER={heater} TARGET={extruder_temp}
	TEMPERATURE_WAIT SENSOR={heater} MINIMUM={extruder_temp - 2} MAXIMUM={extruder_temp + 2}
