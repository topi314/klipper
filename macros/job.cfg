[gcode_macro PRINT_START]
gcode:
	_PRIME_FLAGS_SET
	{% set N = printer.medusahc.tool_count|int %}
	{% set bed_temp = params.BED_TEMP|default(0) | float %}
	{% set initial_tool = params.INITIAL_TOOL | default(0) | int %}
	{% set perform_bed_mesh = params.PERFORM_BED_MESH | default(1) | float %}
	{% set perform_z_tilt = params.PERFORM_Z_TILT | default(1) | float %}
	{% set ns = namespace(temps=[], print_temps=[]) %}

	{% for i in range(N) %}
		{% set prefix = "EXTRUDER" if i == 0 else "EXTRUDER" ~ i %}
		{% set ns.temps = ns.temps + [params[prefix ~ "_TEMP"]|default(0)|float] %}
		{% set ns.print_temps = ns.print_temps + [params[prefix ~ "_PRINT_TEMP"]|default(0)|float] %}
	{% endfor %}

	{% if initial_tool < 0 or initial_tool >= N %}
		{ action_raise_error("invalid initial tool") }
	{% endif %}

	HELIX_PHASE_HEATING_BED
	SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed_temp}
	{% for i in range(N) %}
		{% if ns.temps[i] > 0 %}
			{% set heater = "extruder" if i == 0 else "extruder" ~ i %}
			SET_HEATER_TEMPERATURE HEATER={heater} TARGET={ns.temps[i]}
		{% endif %}
	{% endfor %}

	HELIX_PHASE_HOMING
	{% set already_homed = "xyz" in printer.toolhead.homed_axes %}
	_HOME_REQUEST
	M400
	{% if already_homed %}
		OPEN
		CLOSE
	{% endif %}
	{% if bed_temp > 0 %}
		HELIX_PHASE_HEATING_BED
		TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp - 1}
	{% endif %}

	{% if perform_z_tilt == 1 %}
		HELIX_PHASE_Z_TILT
		Z_TILT_ADJUST
	{% endif %}

	; TAP_BASE_TOOL sets HEATING_NOZZLE for the tap heat, then CLEANING for the
	; wipe and the probe. Bed mesh replaces that phase when it runs.
	TAP_BASE_TOOL
	{% if perform_bed_mesh == 1 %}
		HELIX_PHASE_BED_MESH
		BED_MESH_CALIBRATE ADAPTIVE=1
	{% endif %}

	_PRIME_FLAGS_CLEAR

	; PURGE_USED_TOOLS sets HEATING_NOZZLE and PURGING once per tool.
	PURGE_USED_TOOLS {rawparams}

	; Final heat of the first printing tool, after the purge dropped it back to idle.
	HELIX_PHASE_HEATING_NOZZLE
	{% set initial_heater = "extruder" if initial_tool == 0 else "extruder" ~ initial_tool %}
	{% set initial_print_temp = ns.print_temps[initial_tool] %}
	SET_HEATER_TEMPERATURE HEATER={initial_heater} TARGET={initial_print_temp}
	TEMPERATURE_WAIT SENSOR={initial_heater} MINIMUM={initial_print_temp}
	T{initial_tool}

	HELIX_READY

[gcode_macro PRINT_END]
gcode:
	TURN_OFF_HEATERS
	_PRIME_FLAGS_SET
	{% if "z" in printer.toolhead.homed_axes %}
		{% set z_clear = [printer.toolhead.position.z, 20]|max %}
		G90
		G0 Z{z_clear} F600
	{% endif %}
	DROP_TOOL

	{% if not printer.pause_resume.is_paused %}
		PARK
	{% endif %}

	M400
	M107
	E_OFF
	BED_MESH_CLEAR
	HELIX_ENDED

[gcode_macro PAUSE]
description: Pause the running print and park toolhead
rename_existing: BASE_PAUSE
gcode:
	{% if printer.pause_resume.is_paused %}
		RESPOND MSG="PAUSE: already paused"
	{% elif printer.print_stats.state == "printing" %}
		{% set mhc_error = printer["gcode_macro _GLOBAL_STATE"].error_state|int %}
		{% if mhc_error == 0 %}
			{% set current_tool = printer.medusahc.current_tool|int %}
			SET_GCODE_VARIABLE MACRO=_GLOBAL_STATE VARIABLE=target_tool VALUE={current_tool}
			RESPOND MSG="PAUSE: parking"
		{% else %}
			RESPOND MSG="PAUSE: MedusaHC tool-change error recovery"
		{% endif %}
		{% set extruder = printer.toolhead.extruder %}
		{% if extruder and printer[extruder].can_extrude %}
			G91
			G1 E-1.0 F2100
			G90
		{% endif %}
		BASE_PAUSE
		PARK
		{% if mhc_error == 1 %}
			_LED STATE=error
		{% else %}
			_LED STATE=pause
		{% endif %}
		{% if mhc_error == 1 %}
			{% set target_tool = printer["gcode_macro _GLOBAL_STATE"].target_tool|int %}
			RESPOND MSG="Print paused. Target tool: T{target_tool}"
		{% endif %}
	{% else %}
		RESPOND MSG="PAUSE: ignored (no active file print)"
		SET_GCODE_VARIABLE MACRO=_GLOBAL_STATE VARIABLE=error_state VALUE=0
	{% endif %}

[gcode_macro RESUME]
description: Resume via MedusaHC (restores tool + print position)
rename_existing: BASE_RESUME
gcode:
	{% if printer.pause_resume.is_paused %}
		{% set tgt = printer["gcode_macro _GLOBAL_STATE"].target_tool|int %}
		MHC_RESUME T={tgt}
		_LED_RESTORE
	{% else %}
		RESPOND MSG="RESUME: ignored (not paused)"
		SET_GCODE_VARIABLE MACRO=_GLOBAL_STATE VARIABLE=error_state VALUE=0
	{% endif %}

[gcode_macro CANCEL_PRINT]
description: Cancel the running print and park toolhead
rename_existing: BASE_CANCEL_PRINT
gcode:
	PRINT_END
	BASE_CANCEL_PRINT
	HELIX_RESET
