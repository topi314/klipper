[gcode_macro PRINT_START]
gcode:
	_PRIME_FLAGS_SET
	{% set N = printer.medusahc.tool_count|int %}
	{% set bed_temp = params.BED_TEMP|default(0) | float %}
	{% set initial_tool = params.INITIAL_TOOL | default(0) | int %}
	{% set initial_tool_temp = params.INITIAL_TEMP | default(0) | float %}
	{% set material = params.MATERIAL | default("") %}
	{% set ns = namespace(temps=[]) %}

	{% for i in range(N) %}
		{% if i == 0 %}
			{% set key = "EXTRUDER_TEMP" %}
		{% else %}
			{% set key = "EXTRUDER" ~ i ~ "_TEMP" %}
		{% endif %}
		{% set t = params[key]|default(0)|float %}
		{% set ns.temps = ns.temps + [t] %}
	{% endfor %}

	{% if initial_tool < 0 or initial_tool >= N %}
		{ action_raise_error("invalid initial tool") }
	{% endif %}

	; Heat bed + soft-heat nozzles together while homing
	SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed_temp}
	{% for i in range(N) %}
		{% if ns.temps[i] > 0 %}
			{% if i == 0 %}
				SET_HEATER_TEMPERATURE HEATER=extruder TARGET={ns.temps[i]}
			{% else %}
				SET_HEATER_TEMPERATURE HEATER={"extruder" ~ i} TARGET={ns.temps[i]}
			{% endif %}
		{% endif %}
	{% endfor %}

	G28 home_all
	M400
	{% if bed_temp > 0 %}
		TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp - 1}
	{% endif %}

	Z_TILT_ADJUST
	TAP_BASE_TOOL KEEP_HEAT={% if initial_tool == 0 %}1{% else %}0{% endif %}
	BED_MESH_CALIBRATE ADAPTIVE=1

	; Full heat after mesh (avoid eddy drift + thermal growth during scan)
	{% if initial_tool == 0 %}
		SET_HEATER_TEMPERATURE HEATER=extruder TARGET={initial_tool_temp}
	{% else %}
		SET_HEATER_TEMPERATURE HEATER={"extruder" ~ initial_tool} TARGET={initial_tool_temp}
	{% endif %}

	_PRIME_FLAGS_CLEAR
	T{initial_tool}

	{% if initial_tool == 0 %}
		TEMPERATURE_WAIT SENSOR=extruder MINIMUM={initial_tool_temp}
	{% else %}
		TEMPERATURE_WAIT SENSOR={"extruder" ~ initial_tool} MINIMUM={initial_tool_temp}
	{% endif %}

	LINE_PURGE

[gcode_macro PRINT_END]
gcode:
	TURN_OFF_HEATERS
	_PRIME_FLAGS_SET
	{% if "z" in printer.toolhead.homed_axes %}
		{% set z_clear = [printer.toolhead.position.z, 20]|max %}
		G90
		G0 Z{z_clear} F600
	{% endif %}
	DROP_TOOL

	{% if not printer.pause_resume.is_paused %}
		PARK
	{% endif %}

	M400
	M107
	E_OFF
	BED_MESH_CLEAR

[gcode_macro PAUSE]
description: Pause the running print and park toolhead
rename_existing: BASE_PAUSE
gcode:
	{% if printer.pause_resume.is_paused %}
		RESPOND MSG="PAUSE: already paused"
	{% elif printer.print_stats.state == "printing" %}
		{% set mhc_error = printer["gcode_macro _GLOBAL_STATE"].error_state|int %}
		{% if mhc_error == 0 %}
			{% set current_tool = printer.medusahc.current_tool|int %}
			SET_GCODE_VARIABLE MACRO=_GLOBAL_STATE VARIABLE=target_tool VALUE={current_tool}
			RESPOND MSG="PAUSE: parking"
		{% else %}
			RESPOND MSG="PAUSE: MedusaHC tool-change error recovery"
		{% endif %}
		{% set extruder = printer.toolhead.extruder %}
		{% if extruder and printer[extruder].can_extrude %}
			G91
			G1 E-1.0 F2100
			G90
		{% endif %}
		BASE_PAUSE
		PARK
		{% if mhc_error == 1 %}
			{% set target_tool = printer["gcode_macro _GLOBAL_STATE"].target_tool|int %}
			RESPOND MSG="Print paused. Target tool: T{target_tool}"
		{% endif %}
	{% else %}
		RESPOND MSG="PAUSE: ignored (no active file print)"
		SET_GCODE_VARIABLE MACRO=_GLOBAL_STATE VARIABLE=error_state VALUE=0
	{% endif %}

[gcode_macro RESUME]
description: Resume via MedusaHC (restores tool + print position)
rename_existing: BASE_RESUME
gcode:
	{% if printer.pause_resume.is_paused %}
		{% set tgt = printer["gcode_macro _GLOBAL_STATE"].target_tool|int %}
		MHC_RESUME T={tgt}
	{% else %}
		RESPOND MSG="RESUME: ignored (not paused)"
		SET_GCODE_VARIABLE MACRO=_GLOBAL_STATE VARIABLE=error_state VALUE=0
	{% endif %}

[gcode_macro CANCEL_PRINT]
description: Cancel the running print and park toolhead
rename_existing: BASE_CANCEL_PRINT
gcode:
	PRINT_END
	BASE_CANCEL_PRINT
