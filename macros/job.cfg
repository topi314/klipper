[gcode_macro PRINT_START]
gcode:
	{% set bed_temp = params.BED_TEMP|default(0) | float %}
	{% set tool_temp = params.TOOL_TEMP | default(0) | float %}
	{% set material = params.MATERIAL | default("") %}

	HELIX_PHASE_HEATING_BED
	SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed_temp}
	HELIX_PHASE_HEATING_NOZZLE
	SET_HEATER_TEMPERATURE HEATER=extruder TARGET={tool_temp * 0.75}

	HELIX_PHASE_HOMING
	G28 home_all

	M400
	{% if bed_temp > 0 %}
		TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp - 1}
	{% endif %}
	TEMPERATURE_WAIT SENSOR=extruder MINIMUM={tool_temp * 0.75}

	HELIX_PHASE_Z_TILT
	Z_TILT_ADJUST
	TAP_BASE_TOOL
	HELIX_PHASE_BED_MESH
	BED_MESH_CALIBRATE ADAPTIVE=1

	SET_HEATER_TEMPERATURE HEATER=extruder TARGET={tool_temp}
	TEMPERATURE_WAIT SENSOR=extruder MINIMUM={tool_temp}

	HELIX_PHASE_PURGING
	LINE_PURGE

	HELIX_READY

[gcode_macro PRINT_END]
gcode:
	TURN_OFF_HEATERS

	{% if not printer.pause_resume.is_paused %}
		PARK
	{% endif %}

	M400
	M107
	E_OFF
	BED_MESH_CLEAR
	HELIX_ENDED

[gcode_macro PAUSE]
description: Pause the running print and park toolhead
rename_existing: BASE_PAUSE
gcode:
	M400
	BASE_PAUSE
	PARK

[gcode_macro RESUME]
description: Resume the running print
rename_existing: BASE_RESUME
gcode:
	SAVE_GCODE_STATE NAME=RESUME

	{% if printer.extruder.can_extrude %}
		M83 ; relative extrusion
		G1 E{printer['gcode_macro _KAMP_Settings'].tip_distance} F2100 ; unretract filament
	{% endif %}

	RESTORE_GCODE_STATE NAME=RESUME
	BASE_RESUME {rawparams}

[gcode_macro CANCEL_PRINT]
description: Cancel the running print and park toolhead
rename_existing: BASE_CANCEL_PRINT
gcode:
	PRINT_END
	BASE_CANCEL_PRINT
	HELIX_RESET