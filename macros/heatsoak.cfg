[gcode_macro HEAT_SOAK]
description: Heat the bed, park, and soak. HEAT_SOAK BED_TEMP=100 MINUTES=15
gcode:
	{% set bed_temp = params.BED_TEMP|default(100)|float %}
	{% set minutes = params.MINUTES|default(15)|int %}
	{% set printing = printer.print_stats.state == "printing" %}

	{% if bed_temp > printer.configfile.settings.heater_bed.max_temp|float %}
		{ action_raise_error("HEAT_SOAK: BED_TEMP above heater_bed max_temp") }
	{% endif %}

	SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed_temp}
	{% if not printing %}
		_LED STATE=heating
	{% endif %}

	_HOME_REQUEST
	PARK

	RESPOND MSG="HEAT_SOAK: waiting for bed {bed_temp}C"
	TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp - 1}

	{% for i in range(minutes) %}
		RESPOND MSG="HEAT_SOAK: {minutes - i} min remaining"
		G4 P60000
	{% endfor %}
	RESPOND MSG="HEAT_SOAK: done"

	{% if not printing %}
		_LED_RESTORE
	{% endif %}
