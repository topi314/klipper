[gcode_macro _BED]
variable_size_x: 300
variable_size_y: 300
variable_origin_x: 0
variable_origin_y: 0
gcode:

[gcode_macro _HOME_REQUEST]
description: Conditional home for MedusaHC toolchange paths
gcode:
	{% if "xyz" not in printer.toolhead.homed_axes %}
		G28
	{% endif %}

[gcode_macro _HOME_X]
gcode:
	{% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
	{% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
	{% set HOME_CURRENT = (RUN_CURRENT_X * 0.7)|round(2) %}
	SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
	SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

	SET_KINEMATIC_POSITION X=15 SET_HOMED=X
	G91
	G1 X+10 F1200
	G90
	M400

	G28 X

	G91
	G1 X+10 F1200
	G90

	SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
	SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}

[gcode_macro _HOME_Y]
gcode:
	{% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
	{% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
	{% set HOME_CURRENT = (RUN_CURRENT_X * 0.7)|round(2) %}
	SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
	SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

	SET_KINEMATIC_POSITION Y=15 SET_HOMED=Y
	G91
	G1 Y+10 F1200
	G90
	M400

	G28 Y

	G91
	G1 Y+10 F1200
	G90

	SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
	SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}

[gcode_macro _HOME_Z]
gcode:
	PROBE_CENTER

	G28 Z

	G1 Z30 F600

[homing_override]
axes: xyz
gcode:
	{% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
	{% set is_paused = printer.print_stats.state == "paused" %}

	_LED STATE=homing

	{% if not is_paused %}
		SET_KINEMATIC_POSITION Z=1
		G1 Z5 F600
	{% endif %}

	{% if home_all or 'Y' in params %}
		_HOME_Y
	{% endif %}

	{% if home_all or 'X' in params %}
		_HOME_X
	{% endif %}

	{% if home_all or 'Y' in params %}
		_HOME_Y
	{% endif %}

	{% if home_all or 'X' in params %}
		_HOME_X
	{% endif %}

	{% if home_all or 'Z' in params %}
		_HOME_Z
	{% endif %}

	OPEN
	CLOSE
	_LED_RESTORE
