[include fluidd.cfg]

[include macros/*.cfg]

[include timelapse.cfg]

[include kamp.cfg]

[include eddy_ng.cfg]

[include input_shaper.cfg]

[include toolhead.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_28001B0006504E5238363120-if00

[mcu zboard]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_1200370015504B5735313920-if00

[mcu rpi]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: corexy
max_velocity: 700
max_accel: 18000
max_z_velocity: 50
max_z_accel: 500

[board_pins]
aliases:
	# EXP1 header
	EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
	EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

[virtual_sdcard]
path: /home/topi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[z_tilt]
z_positions:
	233, 88
	-15, 88
	110, 260
points:
	200, 18
	20, 18
	110, 180
retries: 3
retry_tolerance: 0.02
horizontal_move_z: 2.0
speed: 200


[bed_mesh]
speed: 200
horizontal_move_z: 2
mesh_min: 5, 5
mesh_max: 210, 210
probe_count: 32, 32
algorithm: bicubic


[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 64
rotation_distance: 32
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 239
position_min: -23
position_max: 239
homing_speed: 50
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PC11
diag_pin: PC0
tx_pin: PC10
uart_address: 0
run_current: 0.750
stealthchop_threshold: 0
driver_SGTHRS: 130

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 64
rotation_distance: 32
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 240
position_min: -29
position_max: 241
homing_speed: 50
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PC11
diag_pin: PC1
tx_pin: PC10
uart_address: 2
run_current: 0.750
stealthchop_threshold: 0
driver_SGTHRS: 130

[stepper_z]
step_pin: zboard:PB13
dir_pin: !zboard:PB12
enable_pin: !zboard:PB14
microsteps: 128
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -50
homing_speed: 25
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: zboard:PC11
tx_pin: zboard:PC10
uart_address: 0
run_current: 0.580
stealthchop_threshold: 999999

[stepper_z1]
step_pin: zboard:PB10
dir_pin: !zboard:PB2
enable_pin: !zboard:PB11
microsteps: 128
rotation_distance: 8

[tmc2209 stepper_z1]
uart_pin: zboard:PC11
tx_pin: zboard:PC10
uart_address: 1
run_current: 0.580
stealthchop_threshold: 999999

[stepper_z2]
step_pin: zboard:PB0
dir_pin: !zboard:PC5
enable_pin: !zboard:PB1
microsteps: 128
rotation_distance: 8

[tmc2209 stepper_z2]
uart_pin: zboard:PC11
tx_pin: zboard:PC10
uart_address: 2
run_current: 0.580
stealthchop_threshold: 999999

[heater_bed]
heater_pin: PC9
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC4
control: pid
pid_Kp: 71.174
pid_Ki: 1.293
pid_Kd: 979.537
min_temp: 0
max_temp: 130

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[controller_fan electronics]
pin: PB15
fan_speed: 0.7
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, stepper_z2
#stepper:
heater: extruder, heater_bed

[controller_fan psu]
pin: PC6
fan_speed: 0.7
heater: extruder, heater_bed

[exclude_object]

[respond]

[gcode_arcs]
resolution: 1.0

[pause_resume]
recover_velocity: 100

[force_move]
enable_force_move: true

