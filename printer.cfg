[include fluidd.cfg]

[include macros/*.cfg]

[include timelapse.cfg]

[include kamp.cfg]

[include eddy_seek.cfg]

[include input_shaper.cfg]

[include toolhead.cfg]

[include tools.cfg]

[include MedusaHC/MHC_config.cfg]

[mcu]
serial: /dev/ttyAMA0
restart_method: command

[mcu expander]
serial: /dev/serial/by-id/usb-Klipper_stm32f042x6_10002B000E43323543323320-if00
restart_method: command

[mcu ebb]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_EBB36_GEN-if00
restart_method: command

[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_50443404087A631C-if00
restart_method: command

[mcu eddy_bed]
serial: /dev/serial/by-id/usb-Klipper_rp2040_504434041061C41C-if00
restart_method: command

[mcu rpi]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: corexy
max_velocity: 700
max_accel: 22000
max_z_velocity: 50
max_z_accel: 500

[virtual_sdcard]
path: /home/topi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[z_tilt]
z_positions:
	329, 250
	329, 46
	-28, 149
# adjust below for probe offsets
# points:
# 	250, 250
# 	250, 46
# 	51, 149
points:
	250, 280
	250, 76
	51, 179
retries: 3
retry_tolerance: 0.02
horizontal_move_z: 2.0
speed: 200

[bed_mesh]
speed: 200
horizontal_move_z: 2
mesh_min: 5, 5
mesh_max: 295, 260
probe_count: 9, 9
algorithm: bicubic
zero_reference_position: 150, 150

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 64
rotation_distance: 32
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: -36
position_min: -36
position_max: 339
homing_speed: 50
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PC4
diag_pin: PG6
run_current: 1.00
interpolate: False
driver_SGTHRS: 140

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 64
rotation_distance: 32
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -7
position_min: -7
position_max: 344
homing_speed: 50
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PD11
diag_pin: PG9
run_current: 1.00
interpolate: False
driver_SGTHRS: 140

[stepper_z]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
microsteps: 128
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 350
position_min: -10
homing_speed: 25
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: PC6
run_current: 0.580
stealthchop_threshold: 999999

[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA2
microsteps: 128
rotation_distance: 8

[tmc2209 stepper_z1]
uart_pin: PC7
run_current: 0.580
stealthchop_threshold: 999999

[stepper_z2]
step_pin: PF9
dir_pin: !PF10
enable_pin: !PG2
microsteps: 128
rotation_distance: 8

[tmc2209 stepper_z2]
uart_pin: PF2
run_current: 0.580
stealthchop_threshold: 999999

[heater_bed]
heater_pin: PA1
sensor_type: ATC Semitec 104GT-2
sensor_pin: PF3
control: pid
pid_Kp: 72.565
pid_Ki: 0.707
pid_Kd: 1861.281
min_temp: 0
max_temp: 130

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[controller_fan electronics]
pin: PD14
fan_speed: 0.6
kick_start_time: 0.5
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, stepper_z2
heater: extruder, extruder1, extruder2, extruder3, extruder4, extruder5

[controller_fan electronics_bed]
pin: PD15
fan_speed: 0.8
kick_start_time: 0.5
stepper: 
heater: heater_bed

[exclude_object]

[respond]

[display_status]

[gcode_arcs]
resolution: 1.0

[pause_resume]
recover_velocity: 100

[force_move]
enable_force_move: true
