# [multi_pin part_fans]
# pins: ebb:PD3, ebb:PA5

[fan]
# pin: multi_pin:part_fans
pin: ebb:PA5

[temperature_sensor ebb_36_mcu]
sensor_type: Generic 3950
sensor_pin: ebb:PA0
pullup_resistor: 2200

[servo my_servo]
pin: ebb:PB5
initial_angle: 180

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
frequency: 12000000
max_sensor_hz: 5000000
descend_z: 0.5
i2c_mcu: eddy
i2c_bus: i2c0f
# x_offset: 20
x_offset: 0
y_offset: -30

[temperature_sensor eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

[temperature_sensor eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
