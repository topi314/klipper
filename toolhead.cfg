[mcu ebb]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_EBB36_GEN-if00
restart_method: command

[multi_pin part_fans]
pins: ebb:PD3, ebb:PA5

[fan]
pin: multi_pin:part_fans

[temperature_sensor ebb_36_mcu]
sensor_type: Generic 3950
sensor_pin: ebb:PA0
pullup_resistor: 2200

[tmc2209 extruder]
uart_pin: ebb:PB3
run_current: 0.900
hold_current: 0.300
interpolate: true

[extruder]
step_pin: ebb:PB14
dir_pin: !ebb:PA8
enable_pin: !ebb:PB6
microsteps: 32
rotation_distance: 4.6865
pressure_advance: 0.035
pressure_advance_smooth_time: 0.019
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: ebb:PB4
sensor_pin: ebb:PA3
sensor_type: EPCOS 100K B57560G104F
pullup_resistor: 2200
control: pid
pid_Kp: 29.865
pid_Ki: 11.712
pid_Kd: 19.039
min_temp: 0
max_temp: 290
max_extrude_cross_section: 9999999
max_extrude_only_distance: 700
min_extrude_temp: 0
smooth_time: 2.0

[heater_fan hotend_fan]
heater: extruder
pin: ebb:PD2

[verify_heater extruder]
check_gain_time: 20
hysteresis: 10
heating_gain: 1