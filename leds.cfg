# The left strip only reads a clean signal from the Octopus. The right strip
# is fine on the expander, so the data pins are swapped to match that.
# Front is EXP1 pin 2 (PE7) and back is EXP1 pin 1 (PE8).
# _LED STATE=<stage> replaces whatever is running. Positional effects are
# defined once per strip so each strip animates on its own pixels.

[neopixel right]
pin: expander:PB1
chain_count: 25
color_order: GRB

[neopixel left]
pin: PB10
chain_count: 25
color_order: GRB

[neopixel front]
pin: PE7
chain_count: 23
color_order: GRB

[neopixel back]
pin: PE8
chain_count: 23
color_order: GRB

[led_effect led_idle]
frame_rate: 24
leds:
    neopixel:left
    neopixel:right
    neopixel:front
    neopixel:back
layers:
    breathing 16 0 lighten (0.2, 0.2, 0.2)
    static 0 0 top (0.01, 0.01, 0.01)

[led_effect led_heating]
frame_rate: 24
leds:
    neopixel:left
    neopixel:right
    neopixel:front
    neopixel:back
layers:
    gradient 0.15 2 top (0.08, 0.0, 0.0), (0.4, 0.12, 0.0), (0.45, 0.25, 0.04)

[led_effect led_homing_left]
frame_rate: 24
leds:
    neopixel:left
layers:
    chase 0.5 6 add (0.1, 0.35, 0.7), (0.0, 0.05, 0.12), (0, 0, 0)

[led_effect led_homing_right]
frame_rate: 24
leds:
    neopixel:right
layers:
    chase 0.5 6 add (0.1, 0.35, 0.7), (0.0, 0.05, 0.12), (0, 0, 0)

[led_effect led_homing_front]
frame_rate: 24
leds:
    neopixel:front
layers:
    chase 0.5 6 add (0.1, 0.35, 0.7), (0.0, 0.05, 0.12), (0, 0, 0)

[led_effect led_homing_back]
frame_rate: 24
leds:
    neopixel:back
layers:
    chase 0.5 6 add (0.1, 0.35, 0.7), (0.0, 0.05, 0.12), (0, 0, 0)

[led_effect led_leveling_left]
frame_rate: 24
leds:
    neopixel:left
layers:
    chase 0.35 8 add (0.0, 0.35, 0.4), (0.0, 0.06, 0.08), (0, 0, 0)

[led_effect led_leveling_right]
frame_rate: 24
leds:
    neopixel:right
layers:
    chase 0.35 8 add (0.0, 0.35, 0.4), (0.0, 0.06, 0.08), (0, 0, 0)

[led_effect led_leveling_front]
frame_rate: 24
leds:
    neopixel:front
layers:
    chase 0.35 8 add (0.0, 0.35, 0.4), (0.0, 0.06, 0.08), (0, 0, 0)

[led_effect led_leveling_back]
frame_rate: 24
leds:
    neopixel:back
layers:
    chase 0.35 8 add (0.0, 0.35, 0.4), (0.0, 0.06, 0.08), (0, 0, 0)

[led_effect led_cleaning]
frame_rate: 24
leds:
    neopixel:left
    neopixel:right
    neopixel:front
    neopixel:back
layers:
    breathing 4 0 top (0.2, 0.2, 0.18)

[led_effect led_purging_left]
frame_rate: 24
leds:
    neopixel:left
layers:
    comet 0.35 12 add (0.1, 0.4, 0.12), (0.0, 0.08, 0.02), (0, 0, 0)

[led_effect led_purging_right]
frame_rate: 24
leds:
    neopixel:right
layers:
    comet 0.35 12 add (0.1, 0.4, 0.12), (0.0, 0.08, 0.02), (0, 0, 0)

[led_effect led_purging_front]
frame_rate: 24
leds:
    neopixel:front
layers:
    comet 0.35 12 add (0.1, 0.4, 0.12), (0.0, 0.08, 0.02), (0, 0, 0)

[led_effect led_purging_back]
frame_rate: 24
leds:
    neopixel:back
layers:
    comet 0.35 12 add (0.1, 0.4, 0.12), (0.0, 0.08, 0.02), (0, 0, 0)

[led_effect led_printing_left]
frame_rate: 24
leds:
    neopixel:left
layers:
    progress -1 0 add (0.2, 0.4, 0.6), (0.02, 0.08, 0.2)
    static 0 0 top (0.0, 0.01, 0.04)

[led_effect led_printing_right]
frame_rate: 24
leds:
    neopixel:right
layers:
    progress -1 0 add (0.2, 0.4, 0.6), (0.02, 0.08, 0.2)
    static 0 0 top (0.0, 0.01, 0.04)

[led_effect led_printing_front]
frame_rate: 24
leds:
    neopixel:front
layers:
    progress -1 0 add (0.2, 0.4, 0.6), (0.02, 0.08, 0.2)
    static 0 0 top (0.0, 0.01, 0.04)

[led_effect led_printing_back]
frame_rate: 24
leds:
    neopixel:back
layers:
    progress -1 0 add (0.2, 0.4, 0.6), (0.02, 0.08, 0.2)
    static 0 0 top (0.0, 0.01, 0.04)

[led_effect led_toolchange_left]
frame_rate: 24
leds:
    neopixel:left
layers:
    comet 0.7 10 add (0.5, 0.25, 0.0), (0.15, 0.04, 0.0), (0, 0, 0)

[led_effect led_toolchange_right]
frame_rate: 24
leds:
    neopixel:right
layers:
    comet 0.7 10 add (0.5, 0.25, 0.0), (0.15, 0.04, 0.0), (0, 0, 0)

[led_effect led_toolchange_front]
frame_rate: 24
leds:
    neopixel:front
layers:
    comet 0.7 10 add (0.5, 0.25, 0.0), (0.15, 0.04, 0.0), (0, 0, 0)

[led_effect led_toolchange_back]
frame_rate: 24
leds:
    neopixel:back
layers:
    comet 0.7 10 add (0.5, 0.25, 0.0), (0.15, 0.04, 0.0), (0, 0, 0)

[led_effect led_drop_left]
frame_rate: 24
leds:
    neopixel:left
layers:
    comet 0.45 10 add (0.35, 0.05, 0.5), (0.08, 0.0, 0.12), (0, 0, 0)

[led_effect led_drop_right]
frame_rate: 24
leds:
    neopixel:right
layers:
    comet 0.45 10 add (0.35, 0.05, 0.5), (0.08, 0.0, 0.12), (0, 0, 0)

[led_effect led_drop_front]
frame_rate: 24
leds:
    neopixel:front
layers:
    comet 0.45 10 add (0.35, 0.05, 0.5), (0.08, 0.0, 0.12), (0, 0, 0)

[led_effect led_drop_back]
frame_rate: 24
leds:
    neopixel:back
layers:
    comet 0.45 10 add (0.35, 0.05, 0.5), (0.08, 0.0, 0.12), (0, 0, 0)

[led_effect led_pause]
frame_rate: 24
leds:
    neopixel:left
    neopixel:right
    neopixel:front
    neopixel:back
layers:
    breathing 6 0 top (0.35, 0.16, 0.0)

[led_effect led_error]
frame_rate: 24
leds:
    neopixel:left
    neopixel:right
    neopixel:front
    neopixel:back
layers:
    blink 0.5 0.5 top (0.55, 0.0, 0.0)

[led_effect led_white]
frame_rate: 24
leds:
    neopixel:left
    neopixel:right
    neopixel:front
    neopixel:back
layers:
    static 0 0 top (0.5, 0.5, 0.5)

[gcode_macro _LED_WHITE]
description: Hold both strips at a steady white
gcode:
	SET_LED_EFFECT EFFECT=led_white REPLACE=1 FADETIME=0

[gcode_macro _LED_OFF]
description: Stop every effect and blank both strips
gcode:
	STOP_LED_EFFECTS
	SET_LED LED=left RED=0 GREEN=0 BLUE=0 TRANSMIT=0
	SET_LED LED=right RED=0 GREEN=0 BLUE=0 TRANSMIT=0
	SET_LED LED=front RED=0 GREEN=0 BLUE=0 TRANSMIT=0
	SET_LED LED=back RED=0 GREEN=0 BLUE=0

[gcode_macro LEDS]
description: Turn the LED strips on or off
variable_value: 1
variable_mode: "effects"
gcode:
	{% set current = printer["gcode_macro LEDS"].value|int %}
	{% if params.VALUE is defined %}
		{% set enabled = params.VALUE|int %}
	{% else %}
		{% set enabled = 0 if current else 1 %}
	{% endif %}
	SET_GCODE_VARIABLE MACRO=LEDS VARIABLE=value VALUE={1 if enabled else 0}
	SAVE_VARIABLE VARIABLE=led_enabled VALUE={1 if enabled else 0}
	{% if enabled %}
		_LED_RESTORE
	{% else %}
		_LED_OFF
	{% endif %}

[delayed_gcode _LED_BOOT]
initial_duration: 0.5
gcode:
	{% set saved = printer.save_variables.variables %}
	{% if 'led_enabled' in saved %}
		{% set enabled = saved.led_enabled|int %}
	{% else %}
		{% set enabled = 1 %}
	{% endif %}
	{% if 'led_mode' in saved %}
		{% set mode = saved.led_mode|string %}
	{% else %}
		{% set mode = 'effects' %}
	{% endif %}
	SET_GCODE_VARIABLE MACRO=LEDS VARIABLE=value VALUE={enabled}
	SET_GCODE_VARIABLE MACRO=LEDS VARIABLE=mode VALUE='"{mode}"'
	SET_GCODE_VARIABLE MACRO=LED_MODE VARIABLE=value VALUE={1 if mode == 'white' else 0}
	{% if enabled %}
		_LED_RESTORE
	{% else %}
		_LED_OFF
	{% endif %}

[gcode_macro LED_MODE]
description: Switch the strips between stage colors and static white
variable_value: 0
gcode:
	{% set current = printer["gcode_macro LEDS"].mode|string %}
	{% if params.VALUE is defined %}
		{% set mode = 'white' if params.VALUE|int else 'effects' %}
	{% elif params.MODE is defined %}
		{% set mode = params.MODE|lower %}
	{% else %}
		{% set mode = 'effects' if current == 'white' else 'white' %}
	{% endif %}
	{% if mode not in ['effects', 'white'] %}
		{ action_raise_error("LED_MODE MODE=effects or MODE=white") }
	{% endif %}
	SET_GCODE_VARIABLE MACRO=LEDS VARIABLE=mode VALUE='"{mode}"'
	SET_GCODE_VARIABLE MACRO=LED_MODE VARIABLE=value VALUE={1 if mode == 'white' else 0}
	SAVE_VARIABLE VARIABLE=led_mode VALUE='"{mode}"'
	{% if printer["gcode_macro LEDS"].value|int %}
		_LED_RESTORE
	{% endif %}

[gcode_macro _LED]
description: Switch both strips to a print stage
gcode:
	{% set state = params.STATE|default('idle')|lower %}
	{% if printer["gcode_macro LEDS"].value|int == 0 %}
		_LED_OFF
	{% elif printer["gcode_macro LEDS"].mode|string == 'white' %}
		_LED_WHITE
	{% elif state in ['heating', 'heating_bed', 'heating_nozzle'] %}
		SET_LED_EFFECT EFFECT=led_heating REPLACE=1 FADETIME=0.4 RESTART=1
	{% elif state == 'homing' %}
		SET_LED_EFFECT EFFECT=led_homing_left REPLACE=1 FADETIME=0.4 RESTART=1
		SET_LED_EFFECT EFFECT=led_homing_right REPLACE=1 FADETIME=0.4 RESTART=1
		SET_LED_EFFECT EFFECT=led_homing_front REPLACE=1 FADETIME=0.4 RESTART=1
		SET_LED_EFFECT EFFECT=led_homing_back REPLACE=1 FADETIME=0.4 RESTART=1
	{% elif state in ['leveling', 'z_tilt', 'qgl', 'bed_mesh'] %}
		SET_LED_EFFECT EFFECT=led_leveling_left REPLACE=1 FADETIME=0.4 RESTART=1
		SET_LED_EFFECT EFFECT=led_leveling_right REPLACE=1 FADETIME=0.4 RESTART=1
		SET_LED_EFFECT EFFECT=led_leveling_front REPLACE=1 FADETIME=0.4 RESTART=1
		SET_LED_EFFECT EFFECT=led_leveling_back REPLACE=1 FADETIME=0.4 RESTART=1
	{% elif state == 'cleaning' %}
		SET_LED_EFFECT EFFECT=led_cleaning REPLACE=1 FADETIME=0.4 RESTART=1
	{% elif state == 'purging' %}
		SET_LED_EFFECT EFFECT=led_purging_left REPLACE=1 FADETIME=0.4 RESTART=1
		SET_LED_EFFECT EFFECT=led_purging_right REPLACE=1 FADETIME=0.4 RESTART=1
		SET_LED_EFFECT EFFECT=led_purging_front REPLACE=1 FADETIME=0.4 RESTART=1
		SET_LED_EFFECT EFFECT=led_purging_back REPLACE=1 FADETIME=0.4 RESTART=1
	{% elif state == 'printing' %}
		SET_LED_EFFECT EFFECT=led_printing_left REPLACE=1 FADETIME=0.4 RESTART=1
		SET_LED_EFFECT EFFECT=led_printing_right REPLACE=1 FADETIME=0.4 RESTART=1
		SET_LED_EFFECT EFFECT=led_printing_front REPLACE=1 FADETIME=0.4 RESTART=1
		SET_LED_EFFECT EFFECT=led_printing_back REPLACE=1 FADETIME=0.4 RESTART=1
	{% elif state == 'toolchange' %}
		SET_LED_EFFECT EFFECT=led_toolchange_left REPLACE=1 FADETIME=0.2 RESTART=1
		SET_LED_EFFECT EFFECT=led_toolchange_right REPLACE=1 FADETIME=0.2 RESTART=1
		SET_LED_EFFECT EFFECT=led_toolchange_front REPLACE=1 FADETIME=0.2 RESTART=1
		SET_LED_EFFECT EFFECT=led_toolchange_back REPLACE=1 FADETIME=0.2 RESTART=1
	{% elif state == 'drop' %}
		SET_LED_EFFECT EFFECT=led_drop_left REPLACE=1 FADETIME=0.2 RESTART=1
		SET_LED_EFFECT EFFECT=led_drop_right REPLACE=1 FADETIME=0.2 RESTART=1
		SET_LED_EFFECT EFFECT=led_drop_front REPLACE=1 FADETIME=0.2 RESTART=1
		SET_LED_EFFECT EFFECT=led_drop_back REPLACE=1 FADETIME=0.2 RESTART=1
	{% elif state == 'pause' %}
		SET_LED_EFFECT EFFECT=led_pause REPLACE=1 FADETIME=0.4 RESTART=1
	{% elif state == 'error' %}
		SET_LED_EFFECT EFFECT=led_error REPLACE=1 FADETIME=0.1 RESTART=1
	{% else %}
		SET_LED_EFFECT EFFECT=led_idle REPLACE=1 FADETIME=0.6 RESTART=1
	{% endif %}

[gcode_macro _LED_RESTORE]
description: Return the strips to the current print phase
gcode:
	{% set err = printer["gcode_macro _GLOBAL_STATE"].error_state|int %}
	{% if err != 0 %}
		_LED STATE=error
	{% elif printer.pause_resume.is_paused %}
		_LED STATE=pause
	{% else %}
		{% set phase = printer["gcode_macro _HELIX_STATE"].phase|lower %}
		_LED STATE={phase}
	{% endif %}
