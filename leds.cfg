# The left strip only reads a clean signal from the Octopus. The right strip
# is fine on the expander, so the data pins are swapped to match that.
# _LED STATE=<stage> replaces whatever is running. Positional effects are
# defined twice so each strip animates on its own 25 LEDs.

[neopixel right]
pin: expander:PB1
chain_count: 25
color_order: GRB

[neopixel left]
pin: PB10
chain_count: 25
color_order: GRB

[led_effect led_idle]
autostart: true
frame_rate: 10
leds:
    neopixel:left
    neopixel:right
layers:
    breathing 8 0 top (0.03, 0.06, 0.12)

[led_effect led_heating]
frame_rate: 24
leds:
    neopixel:left
    neopixel:right
layers:
    gradient 0.15 2 top (0.08, 0.0, 0.0), (0.4, 0.12, 0.0), (0.45, 0.25, 0.04)

[led_effect led_homing_left]
frame_rate: 24
leds:
    neopixel:left
layers:
    chase 0.5 6 add (0.1, 0.35, 0.7), (0.0, 0.05, 0.12), (0, 0, 0)

[led_effect led_homing_right]
frame_rate: 24
leds:
    neopixel:right
layers:
    chase 0.5 6 add (0.1, 0.35, 0.7), (0.0, 0.05, 0.12), (0, 0, 0)

[led_effect led_leveling_left]
frame_rate: 24
leds:
    neopixel:left
layers:
    chase 0.35 8 add (0.0, 0.35, 0.4), (0.0, 0.06, 0.08), (0, 0, 0)

[led_effect led_leveling_right]
frame_rate: 24
leds:
    neopixel:right
layers:
    chase 0.35 8 add (0.0, 0.35, 0.4), (0.0, 0.06, 0.08), (0, 0, 0)

[led_effect led_cleaning]
frame_rate: 24
leds:
    neopixel:left
    neopixel:right
layers:
    breathing 4 0 top (0.2, 0.2, 0.18)

[led_effect led_purging_left]
frame_rate: 24
leds:
    neopixel:left
layers:
    comet 0.35 12 add (0.1, 0.4, 0.12), (0.0, 0.08, 0.02), (0, 0, 0)

[led_effect led_purging_right]
frame_rate: 24
leds:
    neopixel:right
layers:
    comet 0.35 12 add (0.1, 0.4, 0.12), (0.0, 0.08, 0.02), (0, 0, 0)

[led_effect led_printing_left]
frame_rate: 24
leds:
    neopixel:left
layers:
    progress -1 0 add (0.2, 0.4, 0.6), (0.02, 0.08, 0.2)
    static 0 0 top (0.0, 0.01, 0.04)

[led_effect led_printing_right]
frame_rate: 24
leds:
    neopixel:right
layers:
    progress -1 0 add (0.2, 0.4, 0.6), (0.02, 0.08, 0.2)
    static 0 0 top (0.0, 0.01, 0.04)

[led_effect led_toolchange_left]
frame_rate: 24
leds:
    neopixel:left
layers:
    comet 0.7 10 add (0.5, 0.25, 0.0), (0.15, 0.04, 0.0), (0, 0, 0)

[led_effect led_toolchange_right]
frame_rate: 24
leds:
    neopixel:right
layers:
    comet 0.7 10 add (0.5, 0.25, 0.0), (0.15, 0.04, 0.0), (0, 0, 0)

[led_effect led_pause]
frame_rate: 24
leds:
    neopixel:left
    neopixel:right
layers:
    breathing 6 0 top (0.35, 0.16, 0.0)

[led_effect led_error]
frame_rate: 24
leds:
    neopixel:left
    neopixel:right
layers:
    blink 0.5 0.5 top (0.55, 0.0, 0.0)

[gcode_macro _LED]
description: Switch both strips to a print stage
gcode:
	{% set state = params.STATE|default('idle')|lower %}
	{% if state in ['heating', 'heating_bed', 'heating_nozzle'] %}
		SET_LED_EFFECT EFFECT=led_heating REPLACE=1 FADETIME=0.4 RESTART=1
	{% elif state == 'homing' %}
		SET_LED_EFFECT EFFECT=led_homing_left REPLACE=1 FADETIME=0.4 RESTART=1
		SET_LED_EFFECT EFFECT=led_homing_right REPLACE=1 FADETIME=0.4 RESTART=1
	{% elif state in ['leveling', 'z_tilt', 'qgl', 'bed_mesh'] %}
		SET_LED_EFFECT EFFECT=led_leveling_left REPLACE=1 FADETIME=0.4 RESTART=1
		SET_LED_EFFECT EFFECT=led_leveling_right REPLACE=1 FADETIME=0.4 RESTART=1
	{% elif state == 'cleaning' %}
		SET_LED_EFFECT EFFECT=led_cleaning REPLACE=1 FADETIME=0.4 RESTART=1
	{% elif state == 'purging' %}
		SET_LED_EFFECT EFFECT=led_purging_left REPLACE=1 FADETIME=0.4 RESTART=1
		SET_LED_EFFECT EFFECT=led_purging_right REPLACE=1 FADETIME=0.4 RESTART=1
	{% elif state == 'printing' %}
		SET_LED_EFFECT EFFECT=led_printing_left REPLACE=1 FADETIME=0.4 RESTART=1
		SET_LED_EFFECT EFFECT=led_printing_right REPLACE=1 FADETIME=0.4 RESTART=1
	{% elif state == 'toolchange' %}
		SET_LED_EFFECT EFFECT=led_toolchange_left REPLACE=1 FADETIME=0.2 RESTART=1
		SET_LED_EFFECT EFFECT=led_toolchange_right REPLACE=1 FADETIME=0.2 RESTART=1
	{% elif state == 'pause' %}
		SET_LED_EFFECT EFFECT=led_pause REPLACE=1 FADETIME=0.4 RESTART=1
	{% elif state == 'error' %}
		SET_LED_EFFECT EFFECT=led_error REPLACE=1 FADETIME=0.1 RESTART=1
	{% else %}
		SET_LED_EFFECT EFFECT=led_idle REPLACE=1 FADETIME=0.6 RESTART=1
	{% endif %}

[gcode_macro _LED_RESTORE]
description: Return the strips to the current print phase
gcode:
	{% set err = printer["gcode_macro _GLOBAL_STATE"].error_state|int %}
	{% if err != 0 %}
		_LED STATE=error
	{% elif printer.pause_resume.is_paused %}
		_LED STATE=pause
	{% else %}
		{% set phase = printer["gcode_macro _HELIX_STATE"].phase|lower %}
		_LED STATE={phase}
	{% endif %}
